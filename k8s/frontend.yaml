apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: amss
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: amss
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: amss
    spec:
      containers:
      - name: frontend
        image: amss/frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        # VITE_API_URL is baked into the static build at docker build time.
        # The SPA runs in the user's browser, so it must use an address
        # reachable from outside the cluster — the BFF NodePort on localhost.
        # This env var is informational only; nginx serves static files.
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: amss
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: amss
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
    protocol: TCP
