apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-store
  namespace: amss
  labels:
    app.kubernetes.io/name: kb-store
    app.kubernetes.io/part-of: amss
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kb-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kb-store
        app.kubernetes.io/part-of: amss
    spec:
      containers:
      - name: kb-store
        image: amss/kb-store:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: SEED_PATH
          value: /seed-data/kb.json
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 64Mi
            cpu: 100m
          limits:
            memory: 128Mi
            cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: kb-store
  namespace: amss
  labels:
    app.kubernetes.io/name: kb-store
    app.kubernetes.io/part-of: amss
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kb-store
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
