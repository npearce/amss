apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: amss
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: amss
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        app.kubernetes.io/part-of: amss
    spec:
      containers:
      - name: bff
        image: amss/bff:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: KB_STORE_URL
          value: http://kb-store.amss.svc.cluster.local:8081
        - name: TICKET_STORE_URL
          value: http://ticket-store.amss.svc.cluster.local:8082
        - name: CREW_STORE_URL
          value: http://crew-store.amss.svc.cluster.local:8083
        # Agents are not available until Phase 3 (kagent install).
        # STUB_MODE=true makes chat and curate return canned responses without
        # calling the agent URLs.
        - name: STUB_MODE
          value: "true"
        - name: MISSION_SUPPORT_AGENT_URL
          value: http://mission-support-agent.amss.svc.cluster.local:8090
        - name: KB_CURATOR_AGENT_URL
          value: http://kb-curator-agent.amss.svc.cluster.local:8091
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 64Mi
            cpu: 100m
          limits:
            memory: 128Mi
            cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: amss
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: amss
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
