# Debug only — direct NodePort access bypasses agentgateway.
# For normal access, use kubectl port-forward to the agentgateway proxy:
#   kubectl port-forward deployment/agentgateway-proxy -n agentgateway-system 8080:80 &
#   open http://localhost:8080
#
# OrbStack NodePort: http://localhost:30080  (BFF only — frontend API calls won't work)
# kind:              find node IP with `kubectl get nodes -o wide`, then http://<node-ip>:30080
#
apiVersion: v1
kind: Service
metadata:
  name: bff-nodeport
  namespace: amss
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: amss
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: bff
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
